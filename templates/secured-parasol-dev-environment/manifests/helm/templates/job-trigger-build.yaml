apiVersion: batch/v1
kind: Job
metadata:
  name: trigger-first-build
  namespace: ${{ values.namespace }}
spec:
  backoffLimit: 0
  template:
    spec:
      serviceAccountName: parasol-insurance-build
      restartPolicy: Never
      containers:
        - name: trigger
          image: quay.io/agnosticd/ee-multicloud:latest
          env:
            - name: GITLAB_HOST
              value: "${{ values.gitlab_host }}"
            - name: BRANCH
              value: "${{ values.branch }}"
            - name: OWNER
              value: "${{ values.owner }}"
            - name: NAMESPACE
              value: "${{ values.namespace }}"
            - name: GIT_CREDENTIALS
              valueFrom:
                secretKeyRef:
                  name: gitlab-basic-auth
                  key: .git-credentials
          command:
            - /bin/bash
            - -c
            - |
              set -euo pipefail

              GITLAB_TOKEN=$(python3 -c "
              import os, re
              creds = os.environ.get('GIT_CREDENTIALS', '')
              m = re.search(r'://[^:]+:([^@]+)@', creds)
              print(m.group(1) if m else '')
              ")

              # Do not push until the webhook for this sandbox's EventListener exists.
              echo "Waiting for the GitLab push webhook to be configured..."
              WEBHOOK_READY=false
              DEADLINE=$((SECONDS + 600))
              while (( SECONDS < DEADLINE )); do
                ROUTE_HOST=$(oc get route parasol-insurance-secured-listener -n "${NAMESPACE}" \
                  -o jsonpath='{.spec.host}' 2>/dev/null || true)
                if [ -n "${ROUTE_HOST}" ]; then
                  EXPECTED_URL="https://${ROUTE_HOST}"
                  if curl -fsSk --connect-timeout 5 --max-time 10 \
                    -H "PRIVATE-TOKEN: ${GITLAB_TOKEN}" \
                    "https://${GITLAB_HOST}/api/v4/projects/${OWNER}%2Fparasol-insurance-secured/hooks" 2>/dev/null | \
                    python3 -c 'import json,sys; url=sys.argv[1]; hooks=json.load(sys.stdin); sys.exit(0 if any(h.get("url") == url and h.get("push_events") is True for h in hooks) else 1)' \
                    "${EXPECTED_URL}" 2>/dev/null; then
                    WEBHOOK_READY=true
                    echo "GitLab push webhook found for ${EXPECTED_URL}."
                    break
                  fi
                fi
                echo "  Expected webhook not ready; checking again in 10s..."
                sleep 10
              done

              if [ "${WEBHOOK_READY}" != true ]; then
                echo "ERROR: GitLab push webhook for ${OWNER}/parasol-insurance-secured was not ready after 10 minutes; first-build commit was not pushed." >&2
                exit 1
              fi

              # Small delay to ensure EventListener is fully ready
              sleep 15

              # Clone and push trigger commit
              export GIT_SSL_NO_VERIFY=true
              REPO_URL="https://tekton:${GITLAB_TOKEN}@${GITLAB_HOST}/${OWNER}/parasol-insurance-secured.git"
              git clone -b "${BRANCH}" "${REPO_URL}" /tmp/repo
              cd /tmp/repo

              git config user.email "tekton-bot@parasol-insurance.local"
              git config user.name "tekton-bot"

              date -u > .build-trigger
              git add .build-trigger
              COMMIT_MSG="new branch: ${BRANCH}

              Automated-By: tekton-pipeline-setup
              Skip-Signature-Verification: true"
              git commit -m "${COMMIT_MSG}"
              git push origin "${BRANCH}"

              echo "First build triggered successfully."
